name = "RPG-30 Hook"
prefix = "rpg"
mainprefix = "z"
author = "Sam, DarkBall, and contributors"

[files]
include = [
    "meta.cpp",
    "mod.cpp",
    "data/1024.paa",
    "data/256.paa",
    "data/128.paa",
    "keys/rpg_30.bikey",
]

exclude = [
    "**/.DS_Store",
    "**/Thumbs.db",
    "**/*.bak",
    "**/*.bak.*",
    "**/*.back.*",
    "**/*.tmp",
    "**/*.orig",
    "**/*.rej",
    "**/* - Copy.*",
    "**/*.psd",
    "**/*.psb",
    "**/*.xcf",
    "**/*.blend",
    "**/*.blend1",
    "**/.gitkeep",
    "addons/**/README*",
    "optionals/**/README*",
]

[version]
major = 1
minor = 1
patch = 0
git_hash = 0

[hemtt.build]
pdrive = "disallow"

[hemtt.release]
folder = "RPG_30"

[signing]
authority = "rpg_30"
